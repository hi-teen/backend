version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mysqldb
    restart: always
    ports:
      - "3306:3306"
    env_file:
      - backend.env
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - backend.env
    expose:
      - "8080"
    networks:
      - app_network

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  mysql-data:

networks:
  app_network:
    driver: bridge
