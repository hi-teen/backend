version: '3.8'

services:
  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysqld-exporter
    ports:
      - "9104:9104"
    env_file:
      - backend.env
    entrypoint: >
      sh -c "mysqld_exporter --mysqld.username=root:$MYSQL_ROOT_PASSWORD \
             --mysqld.address=$MYSQL_HOST:$MYSQL_PORT"
    networks:
      - app_network


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - app_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - app_network

  ngrinder-controller:
    image: ngrinder/controller:latest
    container_name: ngrinder-controller
    ports:
      - "8181:80"
      - "16001:16001"
    volumes:
      - ngrinder_controller_data:/opt/ngrinder-controller
    networks:
      - app_network
    environment:
      - NGRINDER_AGENT_SERVICE_NAME=ngrinder-agent
      - NGRINDER_AGENT_PORT=16001


  ngrinder-agent:
    image: ngrinder/agent:latest
    container_name: ngrinder-agent
    networks:
      - app_network
    environment:
      - NGRINDER_CONTROLLER_HOST=ngrinder-controller
      - NGRINDER_CONTROLLER_PORT=80

volumes:
  prometheus-data:
  grafana-data:
  ngrinder_controller_data:

networks:
  app_network:
    external: true
    name: hiteen_app_network